name: Build & Upload iOS (.ipa)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci

      - name: Build Web App & Sync Capacitor
        run: |
          npm run build
          npx cap sync ios

      - name: Install Apple Certificate & Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: "temporary-ci-password"
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

          python3 -c "import base64, os; s=os.environ.get('BUILD_CERTIFICATE_BASE64','').strip().replace('\r','').replace('\n',''); s+='='*(-len(s)%4); open('certificate.p12','wb').write(base64.b64decode(s))"

          ls -lh certificate.p12
          file certificate.p12

          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -A -T /usr/bin/codesign

          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          python3 -c "import base64, os, re; s=os.environ.get('BUILD_PROVISION_PROFILE_BASE64','').strip().replace('\r','').replace('\n',''); s+='='*(-len(s)%4); data=base64.b64decode(s); d=os.path.expanduser('~/Library/MobileDevice/Provisioning Profiles'); os.makedirs(d, exist_ok=True); open(os.path.join(d, 'profile.mobileprovision'), 'wb').write(data); m=re.search(rb'<key>UUID</key>\s*<string>([^<]+)</string>', data); open(os.path.join(d, f'{m.group(1).decode(\"utf-8\")}.mobileprovision'), 'wb').write(data) if m else None"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '^16'

      - name: Set Dynamic Build Number
        run: |
          cd ios/App
          xcrun agvtool new-version -all ${{ github.run_number }}

      - name: Archive Xcode Project
        run: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            BUILD_TARGET="-workspace ios/App/App.xcworkspace"
          else
            BUILD_TARGET="-project ios/App/App.xcodeproj"
          fi

          xcodebuild $BUILD_TARGET \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            DEVELOPMENT_TEAM="VMX44G9FJJ" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Staff AppStore Profile" \
            PROVISIONING_PROFILE="d1cc8f98-4ca6-4acb-b393-c7a99dc3ade9" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive > xcodebuild.log 2>&1 || ARCHIVE_FAILED=1

          if [ "$ARCHIVE_FAILED" = "1" ] || [ ! -d "build/App.xcarchive" ]; then
            echo "==== EXTRACTED XCODE ERRORS ===="
            grep -i "error:" xcodebuild.log | grep -v "Run script build phase" || tail -n 60 xcodebuild.log
            exit 65
          fi

      - name: Export .ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/out

      - name: Upload .ipa Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Staff-App-iOS-IPA
          path: build/out/*.ipa

      - name: Upload to App Store Connect / TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        if: ${{ env.APPSTORE_KEY_ID != '' && env.APPSTORE_ISSUER_ID != '' }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys ~/.private_keys ./private_keys
          python3 -c "import os; key=os.environ['APPSTORE_PRIVATE_KEY'].strip()+'\n'; kid=os.environ['APPSTORE_KEY_ID']; [open(os.path.expanduser(p), 'w').write(key) for p in [f'~/.appstoreconnect/private_keys/AuthKey_{kid}.p8', f'~/.private_keys/AuthKey_{kid}.p8', f'private_keys/AuthKey_{kid}.p8']]"

          set -e
          IPA_PATH=$(ls build/out/*.ipa | head -n 1)
          xcrun altool --upload-package "$IPA_PATH" --type ios --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID" || xcrun altool --upload-app -f "$IPA_PATH" -t ios --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"
